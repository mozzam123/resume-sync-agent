[project]
name = "resume-sync-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mozzam123", email = "mozzam607@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docx2pdf>=0.1.8",
    "fastapi>=0.162.0",
    "playwright>=1.54.0",
    "python-multipart>=0.0.32",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
resume-sync-agent = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["adapters"]
py-modules = ["main", "app", "api", "db", "storage"]
